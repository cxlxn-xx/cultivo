<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Formulario Lote</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="card shadow col-md-6 mx-auto">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${lote.id == null ? 'Nuevo Lote' : 'Editar Lote'}"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/vista/lote/guardar}" th:object="${lote}" method="post">
                <input type="hidden" th:field="*{id}" />
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <input type="text" class="form-control" th:field="*{descripcion}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Superficie</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{superficie}" required>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/vista/lote}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
