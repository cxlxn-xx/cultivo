<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Compradores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Listado de Compradores</h2>


    <a th:href="@{/vista}" class="btn btn-secondary mb-3">Volver al Menú</a>
    <a th:href="@{/vista/comprador/form}" class="btn btn-success mb-3">+ Nuevo Comprador</a>


    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>CUIT</th>
            <th>IVA</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${comprador}">
            <td th:text="${c.codigo}"></td>
            <td th:text="${c.nombre}"></td>
            <td th:text="${c.direccion}"></td>
            <td th:text="${c.cuit}"></td>
            <td th:text="${c.condicionIva}"></td>
            <td>

                <a th:href="@{/vista/comprador/form(codigo=${c.codigo})}" class="btn btn-sm btn-primary">Editar</a>
                -- Botón Eliminar --
                <a th:href="@{/vista/comprador/eliminar/{id}(id=${c.codigo})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que querés eliminar este comprador?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
