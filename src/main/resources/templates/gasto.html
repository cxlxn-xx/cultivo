<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Gastos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Listado de Gastos</h2>
    <a th:href="@{/vista}" class="btn btn-secondary mb-3">Volver al Menú</a>
    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Concepto</th>
            <th>Cant. Unidades</th>
            <th>Precio Unitario</th>
            <th>ID Plantación</th>
        </tr>
        </thead>
        <tbody>

        <tr th:each="g : ${gasto}">
            <td th:text="${g.id}"></td>
            <td th:text="${g.fecha}"></td>
            <td th:text="${g.concepto}"></td>
            <td th:text="${g.cantidadUnidades}"></td>
            <td th:text="${g.precioUnitario}"></td>
            <td th:text="${g.plantacion.id}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>>
