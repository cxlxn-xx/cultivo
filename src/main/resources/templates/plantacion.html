<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Plantaciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Listado de Plantaciones</h2>
    <a th:href="@{/vista}" class="btn btn-secondary mb-3">Volver al Menú</a>
    <a th:href="@{/vista/plantacion/form}" class="btn btn-success mb-3">+ Nueva Plantación</a>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr><th>ID</th><th>Período</th><th>F. Plantación</th><th>Cultivo</th><th>Lote</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${plantacion}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.periodo}"></td>
            <td th:text="${p.fechaPlantacion}"></td>
            <td th:text="${p.cultivo.descripcion}"></td>
            <td th:text="${p.lote.descripcion}"></td>
            <td>
                <a th:href="@{/vista/plantacion/form(id=${p.id})}" class="btn btn-sm btn-primary">Editar</a>
                <a th:href="@{/vista/plantacion/eliminar/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
