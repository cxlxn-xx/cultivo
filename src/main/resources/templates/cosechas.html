<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Cosechas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Listado de Cosechas</h2>
    <a th:href="@{/vista}" class="btn btn-secondary mb-3">Volver al Menú</a>
    <a th:href="@{/vista/cosechas/form}" class="btn btn-success mb-3">+ Nueva Cosecha</a>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped shadow-sm">
        <thead class="table-dark"><tr><th>ID</th><th>Fecha</th><th>Rendimiento (Kg)</th><th>ID Plantación</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="c : ${cosechas}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.fecha}"></td>
            <td th:text="${c.rendimientokg}"></td>
            <td th:text="${c.plantacion.id}"></td>
            <td>
                <a th:href="@{/vista/cosechas/form(id=${c.id})}" class="btn btn-sm btn-primary">Editar</a>
                <a th:href="@{/vista/cosechas/eliminar/{id}(id=${c.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
