<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menú Principal - Granja</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5 text-center">
    <h1 class="mb-4">Sistema de Cultivos </h1>

    <div class="d-flex justify-content-end mb-3">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger">Cerrar Sesión</button>
        </form>
    </div>

    <div class="list-group w-50 mx-auto shadow">
        <a th:href="@{/vista/cultivos}" class="list-group-item list-group-item-action"> Ver Cultivos</a>
        <a th:href="@{/vista/lote}" class="list-group-item list-group-item-action">️ Ver Lotes</a>
        <a th:href="@{/vista/comprador}" class="list-group-item list-group-item-action"> Ver Compradores</a>
        <a th:href="@{/vista/plantacion}" class="list-group-item list-group-item-action"> Ver Plantaciones</a>
        <a th:href="@{/vista/gasto}" class="list-group-item list-group-item-action"> Ver Gastos</a>
        <a th:href="@{/vista/cosechas}" class="list-group-item list-group-item-action"> Ver Cosechas</a>
        <a th:href="@{/vista/venta}" class="list-group-item list-group-item-action"> Ver Ventas</a>
    </div>
</div>
</body>
</html>
