<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Comprador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="card shadow col-md-6 mx-auto">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${comprador.codigo == null ? 'Nuevo Comprador' : 'Editar Comprador'}"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/vista/comprador/guardar}" th:object="${comprador}" method="post">
                <input type="hidden" th:field="*{codigo}" />
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Dirección</label>
                    <input type="text" class="form-control" th:field="*{direccion}">
                </div>
                <div class="mb-3">
                    <label class="form-label">CUIT</label>
                    <input type="text" class="form-control" th:field="*{cuit}">
                </div>

                <div class="mb-3">
                    <label class="form-label">IVA</label>
                    <input type="text" class="form-control" th:field="*{condicionIva}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Observación</label>
                    <input type="text" class="form-control" th:field="*{observacion}">
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/vista/comprador}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
