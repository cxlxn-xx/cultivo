<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Lotes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Listado de Lotes</h2>
    <a th:href="@{/vista}" class="btn btn-secondary mb-3">Volver al Menú</a>
    <a th:href="@{/vista/lote/form}" class="btn btn-success mb-3">+ Nuevo Lote</a>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped shadow-sm">
        <thead class="table-dark"><tr><th>ID</th><th>Descripción</th><th>Superficie</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="l : ${lote}">
            <td th:text="${l.id}"></td>

            <td th:text="${l.descripcion}"></td>
            <td th:text="${l.superficie}"></td>
            <td>
                <a th:href="@{/vista/lote/form(id=${l.id})}" class="btn btn-sm btn-primary">Editar</a>
                <a th:href="@{/vista/lote/eliminar/{id}(id=${l.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
