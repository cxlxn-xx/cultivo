<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Venta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="card shadow col-md-8 mx-auto">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${venta.id == null ? 'Nueva Venta' : 'Editar Venta'}"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/vista/venta/guardar}" th:object="${venta}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-control" th:field="*{fecha}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Cantidad Vendida</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{cantidadVendida}" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Precio Unitario</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{precioUnitario}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Comprador</label>
                        <select class="form-select" th:field="*{comprador.codigo}" required>
                            <option value="">Seleccione un comprador...</option>
                            <option th:each="c : ${compradores}" th:value="${c.codigo}" th:text="${c.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Plantación</label>
                        <select class="form-select" th:field="*{plantacion.id}" required>
                            <option value="">Seleccione una plantación...</option>
                            <option th:each="p : ${plantaciones}" th:value="${p.id}" th:text="${'N° ' + p.id + ' - ' + p.periodo}"></option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/vista/venta}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
